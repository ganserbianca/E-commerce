      type: object
      required: [message, order]
      properties:
        message:
          type: string
          example: Pagamento aprovado com sucesso.
        order:
          $ref: '#/components/schemas/Order'
    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
