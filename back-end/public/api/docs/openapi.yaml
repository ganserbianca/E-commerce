        neighborhood:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 150
        uf:
          type: string
          minLength: 2
          maxLength: 2
    AddressUpdateRequest:
      type: object
      properties:
        cep:
          type: string
          maxLength: 9
        street:
          type: string
          maxLength: 150
        number:
          type: string
          maxLength: 10
        complement:
