      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: Deve ser único entre os demais usuários.
    UpdateProfileResponse:
      type: object
      required: [message, user]
      properties:
        message:
          type: string
          example: Perfil atualizado com sucesso.
        user:
          $ref: '#/components/schemas/User'
    UpdatePasswordRequest:
