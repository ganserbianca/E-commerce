          nullable: true
          maxLength: 100
        neighborhood:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 150
        uf:
          type: string
          minLength: 2
          maxLength: 2
    AddressDataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Address'
    AddressCollectionResponse:
      type: object
      required: [data]
      properties:
        data:
