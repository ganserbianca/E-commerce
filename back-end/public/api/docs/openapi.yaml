    AddressCreateRequest:
      type: object
      required: [cep, street, number, neighborhood, city, uf]
      properties:
        cep:
          type: string
          maxLength: 9
        street:
          type: string
          maxLength: 150
        number:
          type: string
          maxLength: 10
        complement:
          type: string
          nullable: true
