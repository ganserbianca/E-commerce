services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile.dev
    volumes:
      - ./back-end:/otica
    ports:
      - "8001:80"
    environment:
      SERVER_NAME: ":80"

  frontend:
    build: ./front-end
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

  mysql:
    image: mysql:8.4
    env_file:
      - back-end/.env
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:

